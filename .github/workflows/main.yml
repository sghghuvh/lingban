name: build-apk
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          unzip -q src-3.zip -d proj
          bash proj/ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LingBan-apk
          path: proj/out/*.apk
